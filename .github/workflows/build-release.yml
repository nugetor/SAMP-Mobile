name: Build GTA-2.11 Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository (GTA-2.11 branch)
        uses: actions/checkout@v4
        with:
          ref: GTA-2.11

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix case-sensitive includes
        run: |
          cd app/src/main/cpp/samp
          find . \( -name "*.cpp" -o -name "*.h" \) | while read f; do
            grep -oP '#include\s*"\K[^"]+' "$f" 2>/dev/null | while read inc; do
              dir=$(dirname "$f")
              if [ ! -f "$dir/$inc" ]; then
                real=$(find "$dir" -maxdepth 3 -iname "$(basename "$inc")" 2>/dev/null | head -1)
                if [ -n "$real" ]; then
                  real_basename=$(basename "$real")
                  if [ "$real_basename" != "$(basename "$inc")" ]; then
                    echo "Fixing: $f: '$inc' -> '$real_basename'"
                    sed -i "s|#include \"$inc\"|#include \"$real_basename\"|g" "$f"
                  fi
                fi
              fi
            done
          done

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11-Release-APK
          path: app/build/outputs/apk/release/GTA-2.11-release.apk
          retention-days: 90

      - name: Attach APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/GTA-2.11-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
